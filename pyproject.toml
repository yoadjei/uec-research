[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uec"
version = "0.1.0"
description = "Warranted and unwarranted explanation change under model updates"
requires-python = ">=3.11"

# Lower bounds are what the code actually needs, not what happened to be installed. Everything
# here is required to run the CPU experiments and the test suite; the GPU arms are an extra.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",          # parquet
    "torch>=2.1",
    "captum>=0.7",
    "shap>=0.44",
    "lime>=0.2",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "folktables>=0.0.12",
    "matplotlib>=3.8",
    "torchvision>=0.16",
    "pyyaml>=6.0",          # configs and their drift test
    "tabulate>=0.9",        # DataFrame.to_markdown
]

[project.optional-dependencies]
# only needed for kaggle/scale_probe.py --task text
gpu = ["transformers>=4.40", "datasets>=2.18"]
# cross-checks our distances against an independent implementation
quantus = ["quantus>=0.5"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
